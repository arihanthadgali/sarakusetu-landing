<script>
const buttons = document.querySelectorAll('.lang-btn');
const translatable = document.querySelectorAll('[data-en][data-kn]');

function setLanguage(lang) {
  document.documentElement.lang = lang === 'kn' ? 'kn' : 'en';
  translatable.forEach(el => el.textContent = el.dataset[lang]);
  buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
  localStorage.setItem('saraku-language', lang);
}

buttons.forEach(button => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
setLanguage(localStorage.getItem('saraku-language') || 'en');
</script>
